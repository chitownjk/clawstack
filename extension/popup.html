<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=360">
  <link rel="stylesheet" href="popup.css">
  <title>Tiker</title>
</head>
<body>
  <div id="app">
    <!-- Loading state -->
    <div id="loading" class="screen">
      <div class="loader"></div>
    </div>

    <!-- Auth required -->
    <div id="auth-screen" class="screen hidden">
      <div class="auth-content">
        <div class="logo">T</div>
        <h2>Sign in to Tiker</h2>
        <p>Log in at tiker.com to use the extension.</p>
        <a href="https://www.tiker.com/auth/login" target="_blank" class="btn btn-primary">Sign in</a>
      </div>
    </div>

    <!-- Main screen -->
    <div id="main-screen" class="screen hidden">
      <!-- Header -->
      <div class="header">
        <div class="header-left">
          <span class="logo-small">T</span>
          <span class="greeting" id="greeting">Tiker</span>
        </div>
        <a href="https://www.tiker.com/command" target="_blank" class="btn-icon" title="Open Tiker">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/>
            <polyline points="15 3 21 3 21 9"/>
            <line x1="10" y1="14" x2="21" y2="3"/>
          </svg>
        </a>
      </div>

      <!-- Context detection card (primary - shown first when detected) -->
      <div id="context-card" class="context-card hidden">
        <div class="context-header-row">
          <span id="context-icon" class="context-icon"></span>
          <span id="context-type" class="context-type"></span>
        </div>
        <div id="context-headline" class="context-headline"></div>
        <div id="context-suggestion" class="context-suggestion"></div>
        <div class="context-actions">
          <button id="context-add" class="btn btn-primary btn-sm">Add to Tiker</button>
          <button id="context-dismiss" class="btn btn-ghost btn-sm">Dismiss</button>
        </div>
      </div>

      <!-- No context detected (subtle prompt) -->
      <div id="no-context" class="no-context hidden">
        <span class="no-context-icon">&#128065;</span>
        <span class="no-context-text">Watching this page. I'll light up when I can help.</span>
      </div>

      <!-- Quick task form -->
      <div class="section">
        <div class="section-header">
          <span class="section-title">Quick Add</span>
        </div>
        <div class="task-form">
          <input type="text" id="task-input" placeholder="What do you need to do?" autocomplete="off">
          <div class="task-form-row">
            <div class="task-form-left">
              <input type="date" id="task-date" class="date-input">
              <label class="ai-toggle-wrap">
                <input type="checkbox" id="ai-toggle" checked>
                <span id="ai-toggle-label" class="ai-toggle-text">AI handles it</span>
              </label>
            </div>
            <button id="task-submit" class="btn btn-primary btn-sm">Add</button>
          </div>
        </div>
      </div>

      <!-- Success message -->
      <div id="task-success" class="success hidden">
        <span class="check">&#10003;</span> Task added!
      </div>

      <!-- Briefing summary -->
      <div class="section">
        <div class="section-header">
          <span class="section-title">Today's Briefing</span>
        </div>
        <div id="briefing-content">
          <div class="empty-state">Loading briefing...</div>
        </div>
      </div>
    </div>
  </div>
  <script src="popup.js"></script>
</body>
</html>
